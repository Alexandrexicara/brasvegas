name: BrasVegas CI
on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Test game engine and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Check server syntax
        run: node --check server.js
      - name: Check frontend syntax
        run: node --check public/js/app.js
      - name: Check game engine syntax
        run: node --check game-engine/index.js
      - name: Run game rules tests
        run: npm test
