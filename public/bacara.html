<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bacará | BrasVegas</title>
<style>
:root{--v:#e50914;--p:#0a0a0a;--a:#0066ff;--l:#ff6a00;--g:#39ff14;--dourado:#d4af37;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:linear-gradient(180deg,#002233,#00111a);min-height:100vh;color:#fff;padding:20px;}
h1{text-align:center;font-size:32px;color:var(--dourado);margin-bottom:20px;}
.mesa{max-width:600px;margin:0 auto;background:radial-gradient(circle,#004455,#002233);border-radius:20px;border:6px solid var(--dourado);padding:25px;}
.area{display:flex;justify-content:space-around;margin:20px 0;flex-wrap:wrap;gap:15px;}
.jogador,.banco{text-align:center;min-width:180px;}
.cartas{display:flex;gap:8px;justify-content:center;min-height:110px;}
.carta{width:70px;height:100px;background:#fff;border-radius:6px;padding:5px;color:#000;font-weight:bold;display:flex;flex-direction:column;justify-content:space-between;}
.carta.vm{color:#e50914;}
.pontos{font-size:24px;font-weight:bold;color:var(--g);margin-top:10px;}
.apostas{display:flex;justify-content:center;gap:10px;margin-bottom:15px;flex-wrap:wrap;}
.ap{padding:12px 20px;border-radius:8px;border:2px solid var(--dourado);cursor:pointer;transition:.2s;}
.ap.ativa{border-color:var(--g);box-shadow:0 0 10px var(--g);background:rgba(57,255,20,.1);}
.ctrl{display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap;}
.ctrl input{padding:10px;font-size:18px;width:120px;border-radius:6px;border:2px solid var(--dourado);background:#111;color:#fff;text-align:center;}
.ctrl button{padding:12px 25px;font-size:18px;font-weight:bold;border-radius:8px;border:none;background:linear-gradient(180deg,var(--l),#cc5500);color:#fff;cursor:pointer;}
.saldo{text-align:center;font-size:22px;color:var(--g);font-weight:bold;margin-bottom:10px;}
.res{text-align:center;font-size:24px;font-weight:bold;margin-top:15px;min-height:35px;}
</style></head><body>
<h1>♠️ BACARÁ ♥️</h1>
<div class="saldo">💰 R$ <span id="s">1000,00</span></div>
<div class="mesa">
<div class="apostas">
<div class="ap ativa" id="apJogador">👤 Jogador (1:1)</div>
<div class="ap" id="apBanco">🏦 Banco (0.95:1)</div>
<div class="ap" id="apEmpate">🤝 Empate (8:1)</div>
</div>
<div class="area">
<div class="jogador"><h2>👤 JOGADOR</h2><div class="cartas" id="jogCartas"></div><div class="pontos" id="jogPts">0</div></div>
<div class="banco"><h2>🏦 BANCO</h2><div class="cartas" id="banCartas"></div><div class="pontos" id="banPts">0</div></div>
</div>
<div class="ctrl">
<input type="number" id="a" value="20" min="1">
<button id="btn">DISTRIBUIR!</button>
</div>
<div class="res" id="res"></div>
</div>
<script src="js/multiplayer-game.js"></script></body></html>
