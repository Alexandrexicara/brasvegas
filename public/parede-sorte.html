<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Parede da Sorte | BrasVegas</title>
<style>
:root{--v:#e50914;--p:#0a0a0a;--a:#0066ff;--l:#ff6a00;--g:#39ff14;--dourado:#d4af37;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:linear-gradient(180deg,#1a0000,#0a0a0a);min-height:100vh;color:#fff;padding:20px;}
h1{text-align:center;font-size:32px;color:var(--l);margin-bottom:20px;}
.mae{max-width:450px;margin:0 auto;}
.jogo{position:relative;width:100%;height:500px;background:#111827;border-radius:15px;border:3px solid var(--dourado);overflow:hidden;}
.pinos{position:absolute;top:50px;left:0;right:0;bottom:80px;}
.pino{position:absolute;width:10px;height:10px;background:var(--dourado);border-radius:50%;}
.moeda{position:absolute;width:24px;height:24px;background:radial-gradient(circle,#ffd700,#b8860b);border-radius:50%;z-index:5;display:none;}
.premios{position:absolute;bottom:0;left:0;right:0;height:80px;display:flex;}
.p{flex:1;border-top:2px solid var(--dourado);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;}
.p.x1{background:rgba(0,100,255,.15);color:#80bfff;}
.p.x2{background:rgba(0,150,255,.2);color:#66bfff;}
.p.x5{background:rgba(255,150,0,.2);color:#ffb347;}
.p.x10{background:rgba(255,100,0,.25);color:#ff8833;}
.p.x25{background:rgba(255,50,0,.25);color:#ff5533;}
.p.x50{background:rgba(255,0,0,.3);color:#ff4444;}
.p.x100{background:rgba(212,175,55,.3);color:#ffd700;}
.p.x500{background:rgba(57,255,20,.3);color:#39ff14;}
.ctrl{margin-top:15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.ctrl input{padding:10px;font-size:18px;width:120px;border-radius:6px;border:2px solid var(--dourado);background:#111;color:#fff;text-align:center;}
.ctrl button{padding:12px 25px;font-size:18px;font-weight:bold;border-radius:8px;border:none;background:linear-gradient(180deg,var(--g),#00aa00);color:#000;cursor:pointer;}
.saldo{font-size:20px;color:var(--g);font-weight:bold;}
.res{margin-top:10px;font-size:20px;font-weight:bold;height:30px;}
</style></head><body>
<h1>🪙 PAREDE DA SORTE</h1>
<div class="mae">
<div class="jogo">
<div class="pinos" id="pinos"></div>
<div class="moeda" id="moeda"></div>
<div class="premios">
<div class="p x1" data-m="1">1 pt</div>
<div class="p x2" data-m="2">2 pts</div>
<div class="p x5" data-m="5">5 pts</div>
<div class="p x10" data-m="10">10 pts</div>
<div class="p x25" data-m="25">25 pts</div>
<div class="p x50" data-m="50">50 pts</div>
<div class="p x100" data-m="100">100 pts</div>
<div class="p x500" data-m="500">500 pts</div>
</div>
</div>
<div class="ctrl">
<div class="saldo">R$ <span id="s">1000,00</span></div>
<input type="number" id="a" value="10" min="1">
<button id="btn">LANÇAR!</button>
</div>
<div class="res" id="res"></div>
</div>
<script src="js/multiplayer-game.js"></script></body></html>
