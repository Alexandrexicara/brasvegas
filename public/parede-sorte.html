<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Parede da Sorte | BrasVegas</title>
<style>
:root{--v:#e50914;--p:#0a0a0a;--a:#0066ff;--l:#ff6a00;--g:#39ff14;--dourado:#d4af37;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:linear-gradient(180deg,#1a0000,#0a0a0a);min-height:100vh;color:#fff;padding:20px;}
h1{text-align:center;font-size:32px;color:var(--l);margin-bottom:20px;}
.mae{max-width:450px;margin:0 auto;}
.jogo{position:relative;width:100%;height:500px;background:#111827;border-radius:15px;border:3px solid var(--dourado);overflow:hidden;}
.pinos{position:absolute;top:50px;left:0;right:0;bottom:80px;}
.pino{position:absolute;width:10px;height:10px;background:var(--dourado);border-radius:50%;}
.moeda{position:absolute;width:24px;height:24px;background:radial-gradient(circle,#ffd700,#b8860b);border-radius:50%;z-index:5;display:none;}
.premios{position:absolute;bottom:0;left:0;right:0;height:80px;display:flex;}
.p{flex:1;border-top:2px solid var(--dourado);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;}
.p.x1{background:rgba(0,100,255,.15);color:#80bfff;}
.p.x2{background:rgba(0,150,255,.2);color:#66bfff;}
.p.x5{background:rgba(255,150,0,.2);color:#ffb347;}
.p.x10{background:rgba(255,100,0,.25);color:#ff8833;}
.p.x25{background:rgba(255,50,0,.25);color:#ff5533;}
.p.x50{background:rgba(255,0,0,.3);color:#ff4444;}
.p.x100{background:rgba(212,175,55,.3);color:#ffd700;}
.p.x500{background:rgba(57,255,20,.3);color:#39ff14;}
.ctrl{margin-top:15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.ctrl input{padding:10px;font-size:18px;width:120px;border-radius:6px;border:2px solid var(--dourado);background:#111;color:#fff;text-align:center;}
.ctrl button{padding:12px 25px;font-size:18px;font-weight:bold;border-radius:8px;border:none;background:linear-gradient(180deg,var(--g),#00aa00);color:#000;cursor:pointer;}
.saldo{font-size:20px;color:var(--g);font-weight:bold;}
.res{margin-top:10px;font-size:20px;font-weight:bold;height:30px;}
</style></head><body>
<h1>🪙 PAREDE DA SORTE</h1>
<div class="mae">
<div class="jogo">
<div class="pinos" id="pinos"></div>
<div class="moeda" id="moeda"></div>
<div class="premios">
<div class="p x1" data-m="1">x1</div>
<div class="p x2" data-m="2">x2</div>
<div class="p x5" data-m="5">x5</div>
<div class="p x10" data-m="10">x10</div>
<div class="p x25" data-m="25">x25</div>
<div class="p x50" data-m="50">x50</div>
<div class="p x100" data-m="100">x100</div>
<div class="p x500" data-m="500">🏆</div>
</div>
</div>
<div class="ctrl">
<div class="saldo">R$ <span id="s">1000,00</span></div>
<input type="number" id="a" value="10" min="1">
<button id="btn">LANÇAR!</button>
</div>
<div class="res" id="res"></div>
</div>
<script>
let saldo=1000,ocupado=false;
const s=document.getElementById('s'),a=document.getElementById('a'),btn=document.getElementById('btn');
const moeda=document.getElementById('moeda'),res=document.getElementById('res');
const ps=document.querySelectorAll('.p');
const pinos=document.getElementById('pinos');

for(let l=0;l<9;l++){
  let des=l%2?35:0;
  for(let c=0;c<11;c++){
    const p=document.createElement('div');p.className='pino';
    p.style.left=(c*38+des)+'px';p.style.top=(l*45+20)+'px';
    pinos.appendChild(p);
  }
}

btn.addEventListener('click',jogar);

function jogar(){
  if(ocupado)return;
  const val=Number(a.value),jogo=document.querySelector('.jogo');
  if(!Number.isFinite(val)||val<=0||val>saldo){res.textContent='❌ Aposta inválida ou saldo insuficiente!';res.style.color='#f44';return;}
  ocupado=true;btn.disabled=true;saldo-=val;s.textContent=saldo.toFixed(2).replace('.',',');
  res.textContent='A moeda está descendo pela parede...';res.style.color='#fff';
  const largura=jogo.clientWidth,raio=12,alturaFinal=410;
  let x=largura/2,y=4,vx=(Math.random()-.5)*1.2,vy=1.2;
  moeda.style.display='block';moeda.style.left=(x-raio)+'px';moeda.style.top=(y-raio)+'px';
  const pinosFisicos=[];
  for(let l=0;l<9;l++){const des=l%2?35:0;for(let col=0;col<11;col++)pinosFisicos.push({x:col*38+des+5,y:75+l*45,r:5});}
  function frame(){
    vy=Math.min(vy+.22,6);x+=vx;y+=vy;
    if(x<raio){x=raio;vx=Math.abs(vx)*.72;}
    if(x>largura-raio){x=largura-raio;vx=-Math.abs(vx)*.72;}
    for(const p of pinosFisicos){
      const dx=x-p.x,dy=y-p.y,dist=Math.hypot(dx,dy),min=raio+p.r;
      if(dist>0&&dist<min){
        const nx=dx/dist,ny=dy/dist;x=p.x+nx*(min+.2);y=p.y+ny*(min+.2);
        const vn=vx*nx+vy*ny;
        if(vn<0){vx=(vx-2*vn*nx)*.78;vy=(vy-2*vn*ny)*.72;vx+=((Math.random()-.5)*.32);}
      }
    }
    moeda.style.left=(x-raio)+'px';moeda.style.top=(y-raio)+'px';
    if(y<alturaFinal){requestAnimationFrame(frame);return;}
    const idx=Math.max(0,Math.min(7,Math.floor(x/(largura/8))));
    const premio=ps[idx],mult=Number(premio.dataset.m),ganho=val*mult;
    if(mult>1)saldo+=ganho;
    s.textContent=saldo.toFixed(2).replace('.',',');
    res.textContent=mult===500?'🏆 JACKPOT R$'+ganho.toFixed(2)+'!':'Resultado x'+mult+' — R$'+ganho.toFixed(2);
    res.style.color=mult>=50?'#39ff14':'#ffd700';
    moeda.style.display='none';ocupado=false;btn.disabled=false;
  }
  requestAnimationFrame(frame);
}
</script></body></html>
