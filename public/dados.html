<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dados Craps | BrasVegas</title>
<style>
:root{--v:#e50914;--p:#0a0a0a;--a:#0066ff;--l:#ff6a00;--g:#39ff14;--dourado:#d4af37;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:linear-gradient(180deg,#001122,#000810);min-height:100vh;color:#fff;padding:20px;}
h1{text-align:center;font-size:32px;color:var(--dourado);margin-bottom:20px;}
.mesa{max-width:550px;margin:0 auto;background:linear-gradient(180deg,#004422,#002211);border-radius:20px;border:6px solid var(--dourado);padding:25px;}
.dados{display:flex;justify-content:center;gap:25px;margin:20px 0;}
.dado{width:80px;height:80px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:bold;color:#000;box-shadow:3px 5px 10px rgba(0,0,0,.4);}
.dado.girando{animation:girar .15s infinite alternate;}
@keyframes girar{0%{transform:rotate(-8deg) scale(1.05)}100%{transform:rotate(8deg) scale(0.95)}}
.fase{text-align:center;font-size:20px;font-weight:bold;color:var(--g);margin-bottom:15px;}
.apostas{display:flex;justify-content:center;gap:15px;margin-bottom:15px;flex-wrap:wrap;}
.ap{padding:10px 15px;border-radius:6px;border:2px solid var(--dourado);background:rgba(0,0,0,.4);cursor:pointer;transition:.2s;}
.ap.ativa{background:rgba(57,255,20,.2);border-color:var(--g);box-shadow:0 0 10px var(--g);}
.ctrl{display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap;margin-top:15px;}
.ctrl input{padding:10px;font-size:18px;width:120px;border-radius:6px;border:2px solid var(--dourado);background:#111;color:#fff;text-align:center;}
.ctrl button{padding:12px 25px;font-size:18px;font-weight:bold;border-radius:8px;border:none;background:linear-gradient(180deg,var(--l),#cc5500);color:#fff;cursor:pointer;box-shadow:0 0 12px var(--l);}
.ctrl button:disabled{opacity:.4;cursor:not-allowed;}
.saldo{text-align:center;font-size:22px;color:var(--g);font-weight:bold;margin-bottom:10px;}
.res{text-align:center;font-size:24px;font-weight:bold;margin-top:15px;min-height:35px;}
.info{margin-top:15px;text-align:center;font-size:13px;color:#aaa;}
</style></head><body>
<h1>🎲 DADOS CRAPS</h1>
<div class="saldo">💰 R$ <span id="s">1000,00</span></div>
<div class="mesa">
<div class="fase" id="fase">Jogada de Saída</div>
<div class="dados">
<div class="dado" id="d1">⚀</div>
<div class="dado" id="d2">⚁</div>
</div>
<div class="apostas">
<div class="ap ativa" id="apPassar">✅ Passar</div>
<div class="ap" id="apNaoPassar">❌ Não Passar</div>
</div>
<div class="ctrl">
<input type="number" id="a" value="20" min="1">
<button id="btn">JOGAR!</button>
</div>
<div class="res" id="res"></div>
<div class="info" id="info">Ponto: — | Tire 7 = perde</div>
</div>
<script>
let saldo=1000,ponto=null,girando=false;
let tipo='passar';
const s=document.getElementById('s'),a=document.getElementById('a'),btn=document.getElementById('btn');
const d1=document.getElementById('d1'),d2=document.getElementById('d2');
const fase=document.getElementById('fase'),res=document.getElementById('res'),info=document.getElementById('info');
const apPassar=document.getElementById('apPassar'),apNaoPassar=document.getElementById('apNaoPassar');

apPassar.addEventListener('click',()=>{tipo='passar';apPassar.classList.add('ativa');apNaoPassar.classList.remove('ativa');});
apNaoPassar.addEventListener('click',()=>{tipo='naopassar';apNaoPassar.classList.add('ativa');apPassar.classList.remove('ativa');});

function rolar(){return Math.floor(Math.random()*6)+1;}

btn.addEventListener('click',async ()=>{
  if(girando)return;
  const val=parseFloat(a.value);
  if(val<=0||val>saldo){res.textContent='❌ Aposta inválida!';res.style.color='#f44';return;}
  girando=true;btn.disabled=true;res.textContent='';
  saldo-=val;s.textContent=saldo.toFixed(2).replace('.',',');
  d1.classList.add('girando');d2.classList.add('girando');
  for(let i=0;i<15;i++){d1.textContent=rolar();d2.textContent=rolar();await new Promise(t=>setTimeout(t,60));}
  d1.classList.remove('girando');d2.classList.remove('girando');
  const v1=parseInt(d1.textContent),v2=parseInt(d2.textContent);
  const soma=v1+v2;
  let ganho=0,mensagem='';
  if(!ponto){
    if(tipo==='passar'){
      if(soma===7||soma===11){ganho=val*2;mensagem='✅ GANHOU! +R$'+ganho.toFixed(2);}
      else if(soma===2||soma===3||soma===12){mensagem='❌ PERDEU!';}
      else{ponto=soma;mensagem='🎯 Ponto '+ponto+' estabelecido! Jogue de novo!';fase.textContent='Ponto: '+ponto;info.textContent='Tire '+ponto+' = ganha | Tire 7 = perde';}
    }else{
      if(soma===2||soma===3){ganho=val*2;mensagem='✅ GANHOU! +R$'+ganho.toFixed(2);}
      else if(soma===7||soma===11){mensagem='❌ PERDEU!';}
      else if(soma===12){ganho=val;mensagem='🤝 EMPATE — Devolvido!';}
      else{ponto=soma;mensagem='🎯 Ponto '+ponto+' estabelecido!';fase.textContent='Ponto: '+ponto;info.textContent='Tire 7 = ganha | Tire '+ponto+' = perde';}
    }
  }else{
    if(tipo==='passar'){
      if(soma===ponto){ganho=val*2;mensagem='✅ REPETIU O PONTO! GANHOU! +R$'+ganho.toFixed(2);ponto=null;fase.textContent='Jogada de Saída';info.textContent='Ponto: —';}
      else if(soma===7){mensagem='❌ SAIU 7! PERDEU!';ponto=null;fase.textContent='Jogada de Saída';info.textContent='Ponto: —';}
    }else{
      if(soma===7){ganho=val*2;mensagem='✅ SAIU 7! GANHOU! +R$'+ganho.toFixed(2);ponto=null;fase.textContent='Jogada de Saída';info.textContent='Ponto: —';}
      else if(soma===ponto){mensagem='❌ REPETIU O PONTO! PERDEU!';ponto=null;fase.textContent='Jogada de Saída';info.textContent='Ponto: —';}
    }
  }
  if(ganho>0){saldo+=ganho;res.style.color='#39ff14';}
  else if(mensagem.includes('EMPATE')){res.style.color='#ffd700';}
  else{res.style.color='#ff4444';}
  res.textContent=mensagem;
  s.textContent=saldo.toFixed(2).replace('.',',');
  girando=false;btn.disabled=false;
});
</script></body></html>
