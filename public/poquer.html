<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pôquer | BrasVegas</title>
<style>
:root{--v:#e50914;--p:#0a0a0a;--a:#0066ff;--l:#ff6a00;--g:#39ff14;--dourado:#d4af37;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:linear-gradient(180deg,#001133,#00081a);min-height:100vh;color:#fff;padding:20px;}
h1{text-align:center;font-size:32px;color:var(--dourado);margin-bottom:20px;}
.mesa{max-width:650px;margin:0 auto;background:radial-gradient(circle,#003366,#001a33);border-radius:20px;border:6px solid var(--dourado);padding:25px;}
.cartas{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:20px 0;min-height:130px;}
.carta{width:75px;height:110px;background:#fff;border-radius:6px;padding:5px;color:#000;font-weight:bold;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:.2s;}
.carta.vm{color:#e50914;}
.carta.selecionada{transform:translateY(-10px);box-shadow:0 10px 20px rgba(0,0,0,.5);border:2px solid var(--g);}
.ctrl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:15px;}
.ctrl input{padding:10px;font-size:18px;width:120px;border-radius:6px;border:2px solid var(--dourado);background:#111;color:#fff;text-align:center;}
.ctrl button{padding:12px 20px;font-size:16px;font-weight:bold;border-radius:8px;border:none;background:linear-gradient(180deg,var(--l),#cc5500);color:#fff;cursor:pointer;}
.saldo{text-align:center;font-size:22px;color:var(--g);font-weight:bold;margin-bottom:10px;}
.res{text-align:center;font-size:22px;font-weight:bold;margin-top:15px;min-height:35px;}
.info{text-align:center;font-size:13px;color:#aaa;margin-top:10px;}
</style></head><body>
<h1>♠️ PÔQUER DE 5 CARTAS ♥️</h1>
<div class="saldo">💰 R$ <span id="s">1000,00</span></div>
<div class="mesa">
<div class="cartas" id="mao"></div>
<div class="ctrl">
<input type="number" id="a" value="20" min="1">
<button id="trocar">TROCAR SELECIONADAS</button>
<button id="nova">NOVA MÃO</button>
</div>
<div class="res" id="res"></div>
<div class="info">
A melhor mão da rodada vence. Se houver empate, os vencedores dividem o prêmio compartilhado proporcionalmente às apostas.
</div>
</div>
<script src="js/poquer-multiplayer.js"></script></body></html>
