<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎰 Salão de Jogos — BRASVEGAS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="logo">🎰 SALÃO DE JOGOS</div>
  <div class="saldo-header">💰 R$ <span id="mostrar-saldo">0,00</span></div>
  <div class="nav-botoes">
    <button class="btn btn-verde" onclick="abrirModalDeposito()">⬆️ DEPÓSITO</button>
    <button class="btn btn-preto" onclick="sair()">SAIR</button>
  </div>
</header>
<div class="container">
  <h1 style="text-align:center; color:#ffd700; margin:30px 0;">🎰 ESCOLHA SEU JOGO</h1>
  <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:25px;">
    <div style="background:#1a1a1a; border-radius:16px; padding:25px; text-align:center; border:2px solid #e50914; cursor:pointer;" onclick="window.location.href='roleta.html'">
      <div style="font-size:60px;">🎡</div>
      <h3 style="color:#e50914; font-size:24px;">ROLETA</h3>
      <p style="color:#aaa; margin:10px 0;">Vermelho, Preto ou Verde</p>
      <p style="color:#ffd700; font-weight:bold;">Prêmio até 35x</p>
      <button class="btn btn-vermelho" style="margin-top:15px;">JOGAR AGORA</button>
    </div>
    <div style="background:#1a1a1a;border-radius:16px;padding:25px;text-align:center;border:2px solid #d4af37;cursor:pointer;" onclick="window.location.href='sinuca.html'">
      <div style="font-size:60px;">🎱</div><h3 style="color:#d4af37;font-size:24px;">SINUCA / BILHAR</h3>
      <p style="color:#aaa;margin:10px 0;">Mesa virtual · 2 jogadores ou 4 em duplas</p>
      <p style="color:#ffd700;font-weight:bold;">Mira, força, tacadas e caçapas</p>
      <button class="btn btn-dourado" style="margin-top:15px;">JOGAR AGORA</button>
    </div>
  </div>
</div>
<div id="modal-deposito" class="modal">
  <div class="modal-content">
    <h3>⬆️ FAZER DEPÓSITO</h3>
    <input type="number" id="valor-deposito" placeholder="Valor em R$" min="1">
    <div class="botoes-modal">
      <button class="btn btn-preto" onclick="fecharModalDeposito()">Cancelar</button>
      <button class="btn btn-verde" onclick="confirmarDeposito()">Confirmar</button>
    </div>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
