<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📝 Cadastrar — BRASVEGAS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-container">
  <h2>📝 CRIAR SUA CONTA</h2>
  <input type="text" id="nome-completo" placeholder="👤 Nome completo">
  <input type="text" id="cpf" placeholder="📋 CPF (apenas números)">
  <input type="date" id="data-nascimento">
  <input type="email" id="email-cadastro" placeholder="📧 Seu e-mail">
  <input type="tel" id="telefone" placeholder="📱 Telefone com DDD">
  <input type="password" id="senha-cadastro" placeholder="🔒 Crie uma senha forte">
  <button class="btn btn-laranja" style="width:100%; margin-top:10px;" onclick="fazerCadastro()">CADASTRAR</button>
  <p class="troca-tela">Já tem conta? <a href="login.html">Faça login</a></p>
  <p class="troca-tela"><a href="index.html">← Página inicial</a></p>
</div>
<script src="js/app.js"></script>
</body>
</html>
