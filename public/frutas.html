<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Frutas | BrasVegas</title>
<style>
:root{--v:#e50914;--p:#0a0a0a;--a:#0066ff;--l:#ff6a00;--g:#39ff14;--dourado:#d4af37;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:linear-gradient(180deg,#221100,#110800);min-height:100vh;color:#fff;padding:20px;}
h1{text-align:center;font-size:32px;color:var(--dourado);margin-bottom:20px;}
.maquina{max-width:500px;margin:0 auto;background:linear-gradient(180deg,#662200,#331100);border-radius:20px;border:5px solid var(--dourado);padding:20px;}
.tela{background:#000;border-radius:10px;padding:15px;margin-bottom:15px;}
.linhas{display:flex;gap:8px;justify-content:center;}
.rol{width:90px;height:80px;background:#111;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:36px;border:3px solid var(--dourado);}
.rol.girando{animation:girar .1s infinite alternate;}
@keyframes girar{0%{transform:translateY(-3px)}100%{transform:translateY(3px)}}
.painel{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:15px;}
.bloco{text-align:center;}
.bloco label{display:block;font-size:13px;color:#aaa;}
.bloco span,.bloco input{font-size:20px;font-weight:bold;color:var(--g);}
.bloco input{width:90px;background:#111;border:2px solid var(--dourado);border-radius:5px;text-align:center;padding:4px;color:#fff;}
.btn-girar{width:100%;padding:12px;font-size:22px;font-weight:bold;background:linear-gradient(180deg,var(--l),#cc4400);border:none;border-radius:8px;color:#fff;cursor:pointer;box-shadow:0 0 15px var(--l);}
.btn-girar:disabled{opacity:.4;cursor:not-allowed;}
.res{text-align:center;font-size:22px;font-weight:bold;margin-top:15px;min-height:30px;}
.pg{margin-top:15px;display:grid;grid-template-columns:repeat(2,1fr);gap:5px;font-size:12px;text-align:center;}
.pg div{background:rgba(255,255,255,.05);padding:4px;border-radius:4px;}
</style></head><body>
<h1>🍒 FRUTAS</h1>
<div class="maquina">
<div class="tela"><div class="linhas"><div class="rol" id="r1">🍎</div><div class="rol" id="r2">🍋</div><div class="rol" id="r3">🍇</div></div></div>
<div class="painel"><div class="bloco"><label>SALDO</label><span id="s">1000,00</span></div><div class="bloco"><label>APOSTA</label><input type="number" id="a" value="10" min="1"></div></div>
<button class="btn-girar" id="btn">🎰 GIRAR!</button>
<div class="res" id="res"></div>
<div class="pg">
<div>🍎🍎🍎 = x20</div><div>🍋🍋🍋 = x15</div>
<div>🍇🍇🍇 = x10</div><div>🍊🍊🍊 = x8</div>
<div>🍓🍓🍓 = x5</div><div>⭐⭐⭐ = x50</div>
</div>
</div>
<script src="js/multiplayer-game.js"></script></body></html>
