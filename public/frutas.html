<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colheita Premiada • BRASVEGAS</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#59321b,#170d09 72%);font-family:Segoe UI,Arial;color:#fff;padding:22px}header{text-align:center;margin:8px auto 22px}h1{color:#ffd17a;margin:0 0 8px}.sub{color:#e3c5a5}.game{max-width:650px;margin:auto;background:linear-gradient(145deg,#713d1e,#2b160e);border:5px solid #d3a64c;border-radius:25px;padding:22px;box-shadow:0 20px 55px #000b}.saldo{display:flex;justify-content:space-around;gap:12px;flex-wrap:wrap;color:#baffc6;font-weight:bold;font-size:18px;margin-bottom:18px}.tabuleiro{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;background:#160d09;padding:12px;border:3px solid #b9853c;border-radius:15px}.casa{aspect-ratio:1;background:linear-gradient(145deg,#fff4d7,#d8b77b);border-radius:10px;display:grid;place-items:center;font-size:clamp(28px,7vw,45px);box-shadow:inset 0 0 8px #805b2b,0 3px 5px #0008;transition:transform .2s}.casa.nova{animation:pop .28s ease}@keyframes pop{0%{transform:scale(.5) rotate(-12deg)}100%{transform:scale(1) rotate(0)}}.painel{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px}.painel input{width:120px;padding:12px;background:#1c100a;color:#fff;border:1px solid #e2bd70;border-radius:8px;font-size:18px;text-align:center}button{border:0;border-radius:9px;padding:14px 22px;background:linear-gradient(#ffcf69,#c46b20);color:#241205;font-weight:900;font-size:17px;cursor:pointer}button:disabled{opacity:.5}.resultado{text-align:center;min-height:55px;margin-top:18px;font-size:20px;font-weight:bold}.regras{margin-top:16px;text-align:center;color:#f0d7b6;font-size:13px;line-height:1.7}
</style></head><body><header><h1>🍓 COLHEITA PREMIADA</h1><div class="sub">Jogo de combinações em grade 5 × 3 • não é uma máquina de rolos</div></header>
<main class="game"><div class="saldo"><span>SALDO: R$ <b id="saldo">1.000,00</b></span><span>COLHEITA: <b id="premio">R$ 0,00</b></span></div><div class="tabuleiro" id="tabuleiro"></div>
<div class="painel"><label>Aposta R$ <input id="aposta" type="number" min="1" value="10"></label><button id="jogar">🌱 COLHER</button></div>
<div class="resultado" id="resultado">Encontre grupos de frutas iguais conectadas.</div>
<div class="regras">Grupos conectados de 5 símbolos: x2 • 6 a 7: x4 • 8 a 9: x8 • 10 ou mais: x15<br>Estrelas são curingas e podem completar grupos.</div></main>
<script>
const simbolos=['🍎','🍋','🍇','🍊','🍓','🍉','⭐'];let saldo=1000,busy=false;const tab=document.getElementById('tabuleiro'),fmt=n=>n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});let grade=[];
function gerar(){grade=Array.from({length:15},()=>simbolos[Math.floor(Math.random()*simbolos.length)]);tab.innerHTML='';grade.forEach((s,i)=>{let c=document.createElement('div');c.className='casa';c.textContent=s;c.id='c'+i;tab.appendChild(c)})}gerar();
function maiorGrupo(){let visit=new Set(),melhor=0;for(let i=0;i<15;i++){if(visit.has(i)||grade[i]==='⭐')continue;let alvo=grade[i],fila=[i],grupo=[];visit.add(i);while(fila.length){let n=fila.pop();grupo.push(n);let viz=[n%5? n-1:-1,n%5<4?n+1:-1,n-5,n+5];for(let v of viz){if(v<0||v>=15||visit.has(v))continue;if(grade[v]===alvo||grade[v]==='⭐'){visit.add(v);fila.push(v)}}}melhor=Math.max(melhor,grupo.length)}return melhor}
document.getElementById('jogar').onclick=async()=>{if(busy)return;let v=Number(document.getElementById('aposta').value),out=document.getElementById('resultado'),btn=document.getElementById('jogar');if(!Number.isFinite(v)||v<=0||v>saldo){out.textContent='Aposta inválida ou saldo insuficiente.';return}busy=true;btn.disabled=true;saldo-=v;document.getElementById('saldo').textContent=fmt(saldo);gerar();[...tab.children].forEach((c,i)=>setTimeout(()=>c.classList.add('nova'),i*35));await new Promise(r=>setTimeout(r,700));let n=maiorGrupo(),mult=n>=10?15:n>=8?8:n>=6?4:n>=5?2:0,pay=v*mult;saldo+=pay;document.getElementById('saldo').textContent=fmt(saldo);document.getElementById('premio').textContent='R$ '+fmt(pay);out.style.color=pay?'#baffc6':'#ffd08a';out.textContent=pay?'Grupo de '+n+' símbolos! Colheita de R$ '+fmt(pay):'Nenhum grupo premiado. Tente novamente!';busy=false;btn.disabled=false};
</script><script src="js/brasvegas-audio.js"></script></body></html>
